description=Footprints stay where you walked. The mod watches the foot bones and stamps only at the moment a foot lands, so the prints never drift out of step with the walk - stand still and nothing appears, run and they spread out, and left and right alternate properly. The shape defaults to the foot your character is actually wearing, so changing footwear changes the print. Change the shape: pick from 21 built-in prints, drop in a PNG, draw your own, or roll a random one. Pick any colour, make prints blink, cycle through colours, or glow in the dark. Prints can kick up particles as you step and keep giving them off while they linger. Size and lifetime are yours too, including keeping prints forever. English, Korean and Chinese.
